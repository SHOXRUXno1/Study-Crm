# Static SPA assets + reverse proxy:
#   /api/*     → backend (FastAPI)
#   /assets/*  → nginx static (Vite hashed bundles)
#   everything else → backend serves index.html with dynamic OG tags

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css application/json application/javascript
        text/xml application/xml application/xml+rss text/javascript
        image/svg+xml font/ttf font/otf application/wasm;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed Vite assets — served directly by nginx.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Public files copied from frontend/public by Vite.
    location ~ ^/(favicon-default\.svg|robots\.txt|placeholder\.svg)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Raw index.html for backend template fetch (internal docker network).
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # API → FastAPI.
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # SPA routes — backend injects OG meta from branding DB.
    location / {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
